<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 190" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">How Parallel Programming Works - HPC Supercomputer Flow</title>
  <desc id="description">A simple, clean visualization of how parallel programming works: master rank scatters data across 1,000+ distributed worker nodes for simultaneous execution, then reduces and gathers results.</desc>

  <defs>
    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SF Mono', Monaco, Menlo, Consolas, monospace; }
  </style>

  <!-- Background Frame (Dracula Theme) -->
  <rect width="900" height="190" rx="14" fill="#282a36" stroke="#44475a" stroke-width="1.5"/>

  <!-- Top Title Header -->
  <text x="450" y="24" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f8f8f2" letter-spacing="1">
    HOW PARALLEL PROGRAMMING WORKS <tspan fill="#bd93f9">::</tspan> DISTRIBUTED HPC EXECUTION
  </text>
  <line x1="30" y1="32" x2="870" y2="32" stroke="#44475a" stroke-width="0.8" opacity="0.6"/>

  <!-- ============================================================== -->
  <!-- OPTICAL TRACES: SCATTER (MASTER TO WORKERS)                    -->
  <!-- ============================================================== -->
  <!-- Path In 1 -->
  <path id="pathIn1" d="M 195 96 C 280 96, 290 50, 370 50" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 195 96 C 280 96, 290 50, 370 50" fill="none" stroke="#8be9fd" stroke-width="0.8" opacity="0.6"/>

  <!-- Path In 2 -->
  <path id="pathIn2" d="M 195 96 C 280 96, 290 80, 370 80" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 195 96 C 280 96, 290 80, 370 80" fill="none" stroke="#50fa7b" stroke-width="0.8" opacity="0.6"/>

  <!-- Path In 3 -->
  <path id="pathIn3" d="M 195 96 C 280 96, 290 110, 370 110" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 195 96 C 280 96, 290 110, 370 110" fill="none" stroke="#bd93f9" stroke-width="0.8" opacity="0.6"/>

  <!-- Path In 4 -->
  <path id="pathIn4" d="M 195 96 C 280 96, 290 140, 370 140" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 195 96 C 280 96, 290 140, 370 140" fill="none" stroke="#ff79c6" stroke-width="0.8" opacity="0.6"/>

  <!-- ============================================================== -->
  <!-- OPTICAL TRACES: GATHER / REDUCE (WORKERS TO RESULTS)           -->
  <!-- ============================================================== -->
  <!-- Path Out 1 -->
  <path id="pathOut1" d="M 530 50 C 610 50, 620 96, 705 96" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 530 50 C 610 50, 620 96, 705 96" fill="none" stroke="#8be9fd" stroke-width="0.8" opacity="0.6"/>

  <!-- Path Out 2 -->
  <path id="pathOut2" d="M 530 80 C 610 80, 620 96, 705 96" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 530 80 C 610 80, 620 96, 705 96" fill="none" stroke="#50fa7b" stroke-width="0.8" opacity="0.6"/>

  <!-- Path Out 3 -->
  <path id="pathOut3" d="M 530 110 C 610 110, 620 96, 705 96" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 530 110 C 610 110, 620 96, 705 96" fill="none" stroke="#bd93f9" stroke-width="0.8" opacity="0.6"/>

  <!-- Path Out 4 -->
  <path id="pathOut4" d="M 530 140 C 610 140, 620 96, 705 96" fill="none" stroke="#44475a" stroke-width="2"/>
  <path d="M 530 140 C 610 140, 620 96, 705 96" fill="none" stroke="#ff79c6" stroke-width="0.8" opacity="0.6"/>

  <!-- ============================================================== -->
  <!-- LEFT: MASTER PROCESS / RANK 0 (TASK DISPATCH)                 -->
  <!-- ============================================================== -->
  <g transform="translate(45, 48)">
    <rect width="150" height="96" rx="8" fill="#21222c" stroke="#bd93f9" stroke-width="1.4"/>
    
    <!-- Title Pill -->
    <rect x="10" y="10" width="130" height="22" rx="4" fill="#1e1f29"/>
    <circle cx="20" cy="21" r="3" fill="#bd93f9"/>
    <text x="30" y="25" class="mono" font-size="9.5" font-weight="700" fill="#bd93f9">MASTER (RANK 0)</text>

    <!-- Details -->
    <text x="14" y="48" class="mono" font-size="8" fill="#f8f8f2">1. Split &amp; Decompose</text>
    <text x="14" y="62" class="mono" font-size="7.5" fill="#6272a4">Task partitioning</text>
    
    <!-- MPI Action Badge -->
    <rect x="10" y="70" width="130" height="18" rx="3" fill="#1e1f29" stroke="#bd93f9" stroke-width="0.6"/>
    <text x="75" y="82.5" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#8be9fd">MPI_Scatter / Bcast</text>
  </g>

  <!-- ============================================================== -->
  <!-- CENTER: 4 PARALLEL COMPUTE WORKERS (1,000+ NODES)              -->
  <!-- ============================================================== -->
  <!-- Worker Node 1 -->
  <g transform="translate(370, 38)">
    <rect width="160" height="24" rx="5" fill="#21222c" stroke="#44475a" stroke-width="1"/>
    <circle cx="10" cy="12" r="2.5" fill="#50fa7b"/>
    <text x="20" y="15.5" class="mono" font-size="8" font-weight="700" fill="#f8f8f2">cn-01 · MPI Rank 1</text>
    <text x="150" y="15.5" text-anchor="end" class="mono" font-size="7" font-weight="700" fill="#50fa7b">CPU</text>
  </g>

  <!-- Worker Node 2 -->
  <g transform="translate(370, 68)">
    <rect width="160" height="24" rx="5" fill="#21222c" stroke="#44475a" stroke-width="1"/>
    <circle cx="10" cy="12" r="2.5" fill="#50fa7b"/>
    <text x="20" y="15.5" class="mono" font-size="8" font-weight="700" fill="#f8f8f2">cn-02 · MPI Rank 2</text>
    <text x="150" y="15.5" text-anchor="end" class="mono" font-size="7" font-weight="700" fill="#50fa7b">CPU</text>
  </g>

  <!-- Worker Node 3 (GPU) -->
  <g transform="translate(370, 98)">
    <rect width="160" height="24" rx="5" fill="#21222c" stroke="#bd93f9" stroke-width="1"/>
    <circle cx="10" cy="12" r="2.5" fill="#ff79c6"/>
    <text x="20" y="15.5" class="mono" font-size="8" font-weight="700" fill="#f8f8f2">cn-03 · GPU Rank 3</text>
    <text x="150" y="15.5" text-anchor="end" class="mono" font-size="7" font-weight="700" fill="#ff79c6">CUDA</text>
  </g>

  <!-- Worker Node 4 (GPU) -->
  <g transform="translate(370, 128)">
    <rect width="160" height="24" rx="5" fill="#21222c" stroke="#bd93f9" stroke-width="1"/>
    <circle cx="10" cy="12" r="2.5" fill="#ff79c6"/>
    <text x="20" y="15.5" class="mono" font-size="8" font-weight="700" fill="#f8f8f2">cn-04 · GPU Rank 4</text>
    <text x="150" y="15.5" text-anchor="end" class="mono" font-size="7" font-weight="700" fill="#ff79c6">CUDA</text>
  </g>

  <!-- Scale Indicator Tag -->
  <text x="450" y="163" text-anchor="middle" class="mono" font-size="7.5" fill="#6272a4">
    [ 1,000+ Distributed Nodes Computing in Parallel ]
  </text>

  <!-- ============================================================== -->
  <!-- RIGHT: REDUCE & GATHER RESULTS (COLLECTIVE SYNCHRONIZATION)    -->
  <!-- ============================================================== -->
  <g transform="translate(705, 48)">
    <rect width="150" height="96" rx="8" fill="#21222c" stroke="#ff79c6" stroke-width="1.4"/>
    
    <!-- Title Pill -->
    <rect x="10" y="10" width="130" height="22" rx="4" fill="#1e1f29"/>
    <circle cx="20" cy="21" r="3" fill="#ff79c6"/>
    <text x="30" y="25" class="mono" font-size="9.5" font-weight="700" fill="#ff79c6">GATHER &amp; REDUCE</text>

    <!-- Details -->
    <text x="14" y="48" class="mono" font-size="8" fill="#f8f8f2">2. Combine Results</text>
    <text x="14" y="62" class="mono" font-size="7.5" fill="#6272a4">Global reduction sync</text>
    
    <!-- MPI Action Badge -->
    <rect x="10" y="70" width="130" height="18" rx="3" fill="#1e1f29" stroke="#ff79c6" stroke-width="0.6"/>
    <text x="75" y="82.5" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#50fa7b">MPI_Reduce / Gather</text>
  </g>

  <!-- ============================================================== -->
  <!-- ANIMATED FLOW PULSES (DATA SCATTER & GATHER SNAKE)             -->
  <!-- ============================================================== -->
  <!-- Scatter Pulses (Left to Center) -->
  <circle r="3" fill="#8be9fd" filter="url(#glowCyan)">
    <animateMotion dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathIn1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#50fa7b" filter="url(#glowGreen)">
    <animateMotion begin="0.3s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathIn2"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#bd93f9" filter="url(#glowCyan)">
    <animateMotion begin="0.6s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathIn3"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#ff79c6" filter="url(#glowPink)">
    <animateMotion begin="0.9s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathIn4"/>
    </animateMotion>
  </circle>

  <!-- Gather Pulses (Center to Right) -->
  <circle r="3" fill="#8be9fd" filter="url(#glowCyan)">
    <animateMotion begin="0.75s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathOut1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#50fa7b" filter="url(#glowGreen)">
    <animateMotion begin="1.05s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathOut2"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#bd93f9" filter="url(#glowCyan)">
    <animateMotion begin="1.35s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathOut3"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#ff79c6" filter="url(#glowPink)">
    <animateMotion begin="0.15s" dur="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#pathOut4"/>
    </animateMotion>
  </circle>

  <!-- Bottom Workflow Legend Bar -->
  <text x="450" y="180" text-anchor="middle" class="mono" font-size="8.5" fill="#6272a4">
    PARALLEL WORKFLOW: <tspan fill="#bd93f9">SCATTER DATA</tspan> ➔ <tspan fill="#50fa7b">CONCURRENT MULTI-NODE COMPUTE</tspan> ➔ <tspan fill="#ff79c6">REDUCE RESULTS</tspan>
  </text>
</svg>
