      <rect x="46.0" y="92.0" width="229.5" height="12" fill="#00f2fe"/>
      <rect x="275.5" y="92.0" width="87.5" height="12" fill="#bd93f9"/>
      <rect x="362.9" y="92.0" width="75.3" height="12" fill="#38bdf8"/>
      <rect x="438.2" y="92.0" width="61.0" height="12" fill="#3b82f6"/>
      <rect x="499.1" y="92.0" width="45.1" height="12" fill="#50fa7b"/>
      <rect x="544.2" y="92.0" width="31.8" height="12" fill="#ff79c6"/>
  </g>

  <!-- Language Grid -->

      <circle cx="52" cy="130" r="4" fill="#00f2fe"/>
      <text x="64" y="134" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">C</text>
      <text x="215" y="134" class="mono subtext" text-anchor="end">184 KB</text>
      <text x="270" y="134" class="mono" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="end">43.3%</text>
      <circle cx="52" cy="156" r="4" fill="#bd93f9"/>
      <text x="64" y="160" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">C++</text>
      <text x="215" y="160" class="mono subtext" text-anchor="end">70 KB</text>
      <text x="270" y="160" class="mono" font-size="12" font-weight="700" fill="#bd93f9" text-anchor="end">16.5%</text>
      <circle cx="52" cy="182" r="4" fill="#38bdf8"/>
      <text x="64" y="186" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">Python</text>
      <text x="215" y="186" class="mono subtext" text-anchor="end">60 KB</text>
      <text x="270" y="186" class="mono" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">14.2%</text>
      <circle cx="320" cy="130" r="4" fill="#3b82f6"/>
      <text x="332" y="134" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">TypeScript</text>
      <text x="495" y="134" class="mono subtext" text-anchor="end">49 KB</text>
      <text x="550" y="134" class="mono" font-size="12" font-weight="700" fill="#3b82f6" text-anchor="end">11.5%</text>
      <circle cx="320" cy="156" r="4" fill="#50fa7b"/>
      <text x="332" y="160" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">Shell</text>
      <text x="495" y="160" class="mono subtext" text-anchor="end">36 KB</text>
      <text x="550" y="160" class="mono" font-size="12" font-weight="700" fill="#50fa7b" text-anchor="end">8.5%</text>
      <circle cx="320" cy="182" r="4" fill="#ff79c6"/>
      <text x="332" y="186" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">Others</text>
      <text x="495" y="186" class="mono subtext" text-anchor="end">25 KB</text>
      <text x="550" y="186" class="mono" font-size="12" font-weight="700" fill="#ff79c6" text-anchor="end">6.0%</text>

  <!-- Right: Insights Card -->
  <rect x="608" y="58" width="240" height="150" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="624" y="80" class="mono label">SYSTEMS &amp; CODEBASE</text>
  <line x1="624" y1="90" x2="832" y2="90" stroke="#1f2937" stroke-width="0.8"/>

  <text x="624" y="112" class="mono" font-size="11" fill="#8b949e">PRIMARY STACK</text>
  <text x="624" y="128" class="mono" font-size="13" font-weight="700" fill="#00f2fe">C / C++ · HPC · Linux</text>

  <text x="624" y="152" class="mono" font-size="11" fill="#8b949e">PARALLEL RUNTIMES</text>
  <text x="624" y="168" class="mono" font-size="12" font-weight="600" fill="#10b981">MPI · OpenMP · CUDA · SYCL</text>

  <text x="624" y="192" class="mono" font-size="10" fill="#6e7681">Telemetry active across repos</text>
