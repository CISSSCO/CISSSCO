      <rect x="46.0" y="92.0" width="414.5" height="12" fill="#38bdf8"/>
      <rect x="460.5" y="92.0" width="33.4" height="12" fill="#00f2fe"/>
      <rect x="493.9" y="92.0" width="21.7" height="12" fill="#bd93f9"/>
      <rect x="515.6" y="92.0" width="10.1" height="12" fill="#ff6e96"/>
      <rect x="525.7" y="92.0" width="9.5" height="12" fill="#a78bfa"/>
      <rect x="535.2" y="92.0" width="40.3" height="12" fill="#a78bfa"/>
  </g>

  <!-- Language Grid -->

      <circle cx="52" cy="130" r="4" fill="#38bdf8"/>
      <text x="64" y="134" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">Python</text>
      <text x="215" y="134" class="mono subtext" text-anchor="end">20.7 MB</text>
      <text x="270" y="134" class="mono" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">78.2%</text>
      <circle cx="52" cy="156" r="4" fill="#00f2fe"/>
      <text x="64" y="160" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">C</text>
      <text x="215" y="160" class="mono subtext" text-anchor="end">1.7 MB</text>
      <text x="270" y="160" class="mono" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="end">6.3%</text>
      <circle cx="52" cy="182" r="4" fill="#bd93f9"/>
      <text x="64" y="186" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">C++</text>
      <text x="215" y="186" class="mono subtext" text-anchor="end">1.1 MB</text>
      <text x="270" y="186" class="mono" font-size="12" font-weight="700" fill="#bd93f9" text-anchor="end">4.1%</text>
      <circle cx="320" cy="130" r="4" fill="#ff6e96"/>
      <text x="332" y="134" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">Jupyter Notebook</text>
      <text x="495" y="134" class="mono subtext" text-anchor="end">511 KB</text>
      <text x="550" y="134" class="mono" font-size="12" font-weight="700" fill="#ff6e96" text-anchor="end">1.9%</text>
      <circle cx="320" cy="156" r="4" fill="#a78bfa"/>
      <text x="332" y="160" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">CSS</text>
      <text x="495" y="160" class="mono subtext" text-anchor="end">492 KB</text>
      <text x="550" y="160" class="mono" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="end">1.8%</text>
      <circle cx="320" cy="182" r="4" fill="#a78bfa"/>
      <text x="332" y="186" class="mono" font-size="12" font-weight="600" fill="#f3f4f6">Others</text>
      <text x="495" y="186" class="mono subtext" text-anchor="end">2.0 MB</text>
      <text x="550" y="186" class="mono" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="end">7.6%</text>

  <!-- Right: Insights Card -->
  <rect x="608" y="58" width="240" height="150" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="624" y="80" class="mono label">SYSTEMS &amp; CODEBASE</text>
  <line x1="624" y1="90" x2="832" y2="90" stroke="#1f2937" stroke-width="0.8"/>

  <text x="624" y="112" class="mono" font-size="11" fill="#8b949e">PRIMARY STACK</text>
  <text x="624" y="128" class="mono" font-size="13" font-weight="700" fill="#00f2fe">C / C++ · HPC · Linux</text>

  <text x="624" y="152" class="mono" font-size="11" fill="#8b949e">PARALLEL RUNTIMES</text>
  <text x="624" y="168" class="mono" font-size="12" font-weight="600" fill="#10b981">MPI · OpenMP · CUDA · SYCL</text>

  <text x="624" y="192" class="mono" font-size="10" fill="#6e7681">Telemetry active across repos</text>
