<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 215" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad_GitPush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SF Mono', Consolas, Monaco, monospace; }
    .proj-title { font-size: 15px; font-weight: 700; fill: #00f2fe; letter-spacing: 0.5px; }
    .badge-text { font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; }
    .headline { font-size: 12.5px; font-weight: 600; fill: #ffffff; }
    .desc { font-size: 11px; fill: #8b949e; line-height: 15px; }
    .tag-text { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Frame -->
  <rect width="420" height="215" rx="10" fill="url(#pGrad_GitPush)" stroke="#1e3a8a" stroke-width="1.2"/>

  <!-- Top Bar -->
  <text x="18" y="27" class="mono" font-size="12" fill="#6e7681">~/projects/</text>
  <text x="105" y="27" class="mono proj-title">GitPush</text>

  <!-- Repo Action Pill -->
  <rect x="338" y="14" width="64" height="18" rx="4" fill="#00f2fe18" stroke="#00f2fe" stroke-width="0.8"/>
  <text x="370" y="26" class="mono badge-text" fill="#00f2fe" text-anchor="middle">REPO &#x2197;</text>

  <line x1="18" y1="38" x2="402" y2="38" stroke="#1f2937" stroke-width="1"/>

  <!-- Headline -->
  <text x="18" y="58" class="mono headline">Small command line, smoother Git workflow.</text>

  <!-- Description -->
  <text x="18" y="86" class="mono desc">A minimal CLI that automates staging, commits, and</text>
  <text x="18" y="102" class="mono desc">upstream push sequences in one command.</text>

  <!-- Tags -->
  <g transform="translate(18, 180)">
    <rect x="0" y="0" width="37.6" height="20" rx="4" fill="#ff555518" stroke="#ff5555" stroke-width="0.8"/>
    <text x="18.8" y="14" class="mono tag-text" fill="#ff5555" text-anchor="middle">Git</text>
    <rect x="45.6" y="0" width="73.6" height="20" rx="4" fill="#3b82f618" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="82.4" y="14" class="mono tag-text" fill="#3b82f6" text-anchor="middle">DevTools</text>
  </g>
</svg>