<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 215" width="420" height="215">
  <defs>
    <linearGradient id="pGrad_cerrfix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SF Mono', Consolas, Monaco, monospace; }
    .proj-title { font-size: 15px; font-weight: 700; fill: #00f2fe; letter-spacing: 0.5px; }
    .badge-text { font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; }
    .headline { font-size: 12.5px; font-weight: 600; fill: #ffffff; }
    .desc { font-size: 11px; fill: #8b949e; line-height: 15px; }
    .tag-text { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Frame -->
  <rect width="420" height="215" rx="10" fill="url(#pGrad_cerrfix)" stroke="#1e3a8a" stroke-width="1.2"/>

  <!-- Top Bar -->
  <text x="18" y="27" class="mono" font-size="12" fill="#6e7681">~/projects/</text>
  <text x="105" y="27" class="mono proj-title">cerrfix</text>

  <!-- Repo Action Pill -->
  <rect x="338" y="14" width="64" height="18" rx="4" fill="#00f2fe18" stroke="#00f2fe" stroke-width="0.8"/>
  <text x="370" y="26" class="mono badge-text" fill="#00f2fe" text-anchor="middle">REPO &#x2197;</text>

  <line x1="18" y1="38" x2="402" y2="38" stroke="#1f2937" stroke-width="1"/>

  <!-- Headline -->
  <text x="18" y="58" class="mono headline">Make Linux system errors actionable.</text>

  <!-- Description -->
  <text x="18" y="86" class="mono desc">Rule-based diagnostics and remediation flows for</text>
  <text x="18" y="102" class="mono desc">system administration and runtime faults.</text>

  <!-- Tags -->
  <g transform="translate(18, 180)">
    <rect x="0" y="0" width="88.0" height="20" rx="4" fill="#50fa7b18" stroke="#50fa7b" stroke-width="0.8"/>
    <text x="44.0" y="14" class="mono tag-text" fill="#50fa7b" text-anchor="middle">Automation</text>
    <rect x="96.0" y="0" width="37.6" height="20" rx="4" fill="#00f2fe18" stroke="#00f2fe" stroke-width="0.8"/>
    <text x="114.8" y="14" class="mono tag-text" fill="#00f2fe" text-anchor="middle">CLI</text>
    <rect x="141.6" y="0" width="52.0" height="20" rx="4" fill="#bd93f918" stroke="#bd93f9" stroke-width="0.8"/>
    <text x="167.6" y="14" class="mono tag-text" fill="#bd93f9" text-anchor="middle">Linux</text>
  </g>
</svg>