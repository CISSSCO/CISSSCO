<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 245" width="420" height="245">
  <defs>
    <linearGradient id="eGrad_PROJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SF Mono', Consolas, Monaco, monospace; }
    .badge-text { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .org-title { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .duration { font-size: 11px; font-weight: 500; fill: #38bdf8; }
    .desc { font-size: 11px; fill: #9ca3af; line-height: 15px; }
    .tag-text { font-size: 9.5px; font-weight: 600; }
  </style>

  <!-- Frame -->
  <rect width="420" height="245" rx="10" fill="url(#eGrad_PROJ)" stroke="#1e3a8a" stroke-width="1.2"/>

  <!-- Top Bar: Role Badge -->
  <rect x="18" y="14" width="140.0" height="22" rx="4" fill="#ff79c618" stroke="#ff79c6" stroke-width="0.8"/>
  <text x="88.0" y="29" class="mono badge-text" fill="#ff79c6" text-anchor="middle">PROJECT ENGINEER</text>

  <!-- Right Pill -->
  <rect x="306" y="14" width="96" height="22" rx="4" fill="#10b98118" stroke="#10b981" stroke-width="0.8"/>
  <text x="354" y="29" class="mono badge-text" fill="#10b981" text-anchor="middle">EXPERIENCE &#x2197;</text>

  <line x1="18" y1="44" x2="402" y2="44" stroke="#1f2937" stroke-width="1"/>

  <!-- Org & Duration -->
  <text x="18" y="66" class="mono org-title">Centre for Development of Advanced Computing (C-DAC), India</text>
  <text x="18" y="84" class="mono duration">&gt; Apr 2024 — Present · 2.5 Years</text>

  <line x1="18" y1="94" x2="402" y2="94" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Description -->
  <text x="18" y="112" class="mono desc">Contributing to the National Supercomputing</text>
  <text x="18" y="128" class="mono desc">Mission (NSM): HPC software R&amp;D, SYCL &amp; MPI case</text>
  <text x="18" y="144" class="mono desc">studies, parallel programming education,</text>
  <text x="18" y="160" class="mono desc">workshops, and technical mentoring.</text>

  <!-- Highlights -->
  <g transform="translate(18, 210)">
    <rect x="0" y="0" width="224.8" height="20" rx="4" fill="#ff79c618" stroke="#ff79c6" stroke-width="0.8"/>
    <text x="112.4" y="14" class="mono tag-text" fill="#ff79c6" text-anchor="middle">National Supercomputing Mission</text>
    <rect x="232.79999999999998" y="0" width="41.2" height="20" rx="4" fill="#00f2fe18" stroke="#00f2fe" stroke-width="0.8"/>
    <text x="253.4" y="14" class="mono tag-text" fill="#00f2fe" text-anchor="middle">SYCL</text>
    <rect x="282.0" y="0" width="34.4" height="20" rx="4" fill="#bd93f918" stroke="#bd93f9" stroke-width="0.8"/>
    <text x="299.2" y="14" class="mono tag-text" fill="#bd93f9" text-anchor="middle">MPI</text>
  </g>
</svg>