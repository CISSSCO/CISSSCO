name: Generate Profile Visual Metrics

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: 3D Isometric Contribution Calendar (All Contributions)
  # -------------------------------------------------------------
  isocalendar:
    name: 3D Isometric Contribution Calendar
    runs-on: ubuntu-latest
    steps:
      - name: Generate 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: CISSSCO
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dracula
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update 3d contribution calendar [skip ci]"
          filename: metrics.isocalendar.svg

  # -------------------------------------------------------------
  # Job 2: Pull Requests & Issues Follow-up (All Pull Requests)
  # -------------------------------------------------------------
  followup:
    name: Pull Requests & Issues Follow-up
    needs: isocalendar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pull Requests & Issues Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: CISSSCO
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dracula
          plugin_followup: yes
          plugin_followup_sections: overview, user, repositories
          plugin_followup_indepth: yes
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update pull requests and issues [skip ci]"
          filename: metrics.followup.svg

  # -------------------------------------------------------------
  # Job 3: Recent Activities Timeline (All Recent Activities)
  # -------------------------------------------------------------
  activity:
    name: Recent Activities Feed
    needs: followup
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Recent Activity Feed
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: CISSSCO
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dracula
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update recent activities timeline [skip ci]"
          filename: metrics.activity.svg

  # -------------------------------------------------------------
  # Job 4: Coding Habits & Activity Schedule
  # -------------------------------------------------------------
  habits:
    name: Coding Habits & Rhythm
    needs: activity
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Coding Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: CISSSCO
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dracula
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update coding habits and rhythm [skip ci]"
          filename: metrics.habits.svg

