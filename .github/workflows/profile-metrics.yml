name: Generate Profile Visual Metrics

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate-visuals:
    name: Generate All Profile Visuals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 3D Profile Contribution Calendar (yoshi389111/github-profile-3d-contrib)
      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 2. Animated Contribution Snake (Platane/snk)
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/metrics/github-contribution-grid-snake.svg?color_snake=%2300f2fe&color_dots=%23111827,%231e3a8a,%230284c7,%2300f2fe,%2310b981

      # 3. Setup Python for Cyber-HPC Metrics
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Generate Pull Requests, Live Activity Feed, and Coding Habits SVGs
      - name: Generate Cyber-HPC Metrics SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_metrics.py

      # 5. Commit and push all generated assets cleanly
      - name: Commit & Push Visual Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): update profile visual analytics [skip ci]"
          file_pattern: "assets/metrics/*.svg profile-3d-contrib/*.svg"
